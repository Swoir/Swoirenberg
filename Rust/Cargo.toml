[package]
name = "swoirenberg"
version = "1.0.0-1"
authors = ["Bartosz Nowak", "Michael Elliot", "Theo Madzou"]
repository = "https://github.com/Swoir/Swoirenberg.git"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[build-dependencies]
swift-bridge-build = "0.1"
sha2 = "0.10.8"
regex = "1.10.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swift-bridge = "0.1"
noir_rs = { git = "https://github.com/zkpassport/noir_rs.git", tag = "v1.0.0-1", features = ["barretenberg"] }

[profile.release]
strip = "symbols"
lto = true
opt-level = "z"
panic = "abort"

# blake3's C impl (transitive via noir/ACVM) balloons to ~3.3MB at -O3; size-opt it (circuits never use it).
[profile.release.package.blake3]
opt-level = "z"

# Witness generation is the on-device hot path (EC scalar mult, hashing, ACVM
# solving). -Oz makes it hang for real circuits (e.g. ECDSA sig check), so keep
# these small-but-compute-heavy crates at opt-level 3; the rest stays "z" for size.
[profile.release.package.k256]
opt-level = 3
[profile.release.package.p256]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.primefield]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.num-bigint]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.keccak]
opt-level = 3
[profile.release.package.acvm]
opt-level = 3
[profile.release.package.acvm_blackbox_solver]
opt-level = 3
[profile.release.package.bn254_blackbox_solver]
opt-level = 3
[profile.release.package.brillig_vm]
opt-level = 3
[profile.release.package.ark-bn254]
opt-level = 3
